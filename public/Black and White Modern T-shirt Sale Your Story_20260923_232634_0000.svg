<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="100%" height="100%">
  <defs>
    <!-- Realistic T-Shirt Lighting Gradients -->
    <linearGradient id="shirtBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#ffffff" />
      <stop offset="25%" stopColor="#fdfdfe" />
      <stop offset="65%" stopColor="#e8e8ed" />
      <stop offset="100%" stopColor="#d2d2dc" />
    </linearGradient>
    <linearGradient id="fabricShadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="rgba(0,0,0,0.18)" />
      <stop offset="100%" stopColor="rgba(0,0,0,0)" />
    </linearGradient>
    <linearGradient id="fabricShadeRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="rgba(0,0,0,0.18)" />
      <stop offset="100%" stopColor="rgba(0,0,0,0)" />
    </linearGradient>
    <linearGradient id="collarRib" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f4f4f7" />
      <stop offset="100%" stopColor="#d5d5de" />
    </linearGradient>
    <linearGradient id="fleekBlobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff4d5a" />
      <stop offset="50%" stopColor="#ff7043" />
      <stop offset="100%" stopColor="#ab47bc" />
    </linearGradient>
    <filter id="shirtShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="0" dy="35" stdDeviation="30" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Minimalist Grey Canvas -->
  <rect width="900" height="1600" fill="#ebebee" />

  <!-- Top Brand Eyebrow -->
  <g text-anchor="middle" font-family="'Space Grotesk', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#18181b">
    <text x="450" y="85" font-size="20" letter-spacing="9">FLEEK</text>
    <text x="450" y="112" font-size="18" letter-spacing="8">CLOTHING</text>
    <text x="450" y="138" font-size="17" letter-spacing="7">STORE</text>
  </g>

  <!-- Giant Upper SALE Typography -->
  <text
    x="450"
    y="440"
    text-anchor="middle"
    font-family="'Syne', 'Impact', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="340"
    letter-spacing="-12"
    fill="#09090b"
  >SALE</text>

  <!-- Giant Lower SALE Typography -->
  <text
    x="450"
    y="1360"
    text-anchor="middle"
    font-family="'Syne', 'Impact', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="340"
    letter-spacing="-12"
    fill="#09090b"
  >SALE</text>

  <!-- Central Realistic 3D White T-Shirt -->
  <g transform="translate(450, 840)" filter="url(#shirtShadow)">
    <!-- Base Shirt Silhouette -->
    <path
      d="M -115,-320
         C -60,-280 60,-280 115,-320
         L 285,-200
         C 315,-175 305,-120 255,-80
         L 190,-120
         L 180,260
         C 180,290 150,305 0,305
         C -150,305 -180,290 -180,260
         L -190,-120
         L -255,-80
         C -305,-120 -315,-175 -285,-200
         Z"
      fill="url(#shirtBody)"
      stroke="#d0d0d8"
      stroke-width="2"
    />

    <!-- Sleeve Seams -->
    <path d="M -190,-120 L -115,-320" stroke="#c0c0cb" stroke-width="2.5" fill="none" opacity="0.6" />
    <path d="M 190,-120 L 115,-320" stroke="#c0c0cb" stroke-width="2.5" fill="none" opacity="0.6" />

    <!-- Crewneck Collar -->
    <path
      d="M -115,-320 C -60,-270 60,-270 115,-320 C 65,-250 -65,-250 -115,-320 Z"
      fill="url(#collarRib)"
      stroke="#b8b8c4"
      stroke-width="2"
    />

    <!-- Fabric Shadow & Drapery Folds -->
    <path d="M -180,-100 Q -155,90 -170,260" stroke="url(#fabricShadeLeft)" stroke-width="36" fill="none" opacity="0.75" />
    <path d="M 180,-100 Q 155,90 170,260" stroke="url(#fabricShadeRight)" stroke-width="36" fill="none" opacity="0.75" />
    <path d="M -50,-10 Q -65,120 -80,270" stroke="rgba(0,0,0,0.06)" stroke-width="24" fill="none" />
    <path d="M 50,-10 Q 65,120 80,270" stroke="rgba(0,0,0,0.06)" stroke-width="24" fill="none" />

    <!-- T-Shirt Graphic: FLEEK + Coral/Purple Fluid Blob + Metadata -->
    <g transform="translate(0, -60)">
      <!-- FL Text -->
      <text
        x="-75"
        y="12"
        font-family="'Syne', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="64"
        fill="#0a0a0c"
        letter-spacing="-1"
      >FL</text>

      <!-- Signature Liquid Camo / Organic Fluid Blob -->
      <path
        d="M -12,-15
           C 5,-32 28,-28 34,-8
           C 38,8 24,24 6,26
           C -12,28 -22,12 -12,-15
           Z"
        fill="url(#fleekBlobGrad)"
      />

      <!-- EK Text -->
      <text
        x="36"
        y="12"
        font-family="'Syne', 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="900"
        font-size="64"
        fill="#0a0a0c"
        letter-spacing="-1"
      >EK</text>

      <!-- Small Brand Tags on Chest -->
      <g font-family="'Space Grotesk', 'Inter', sans-serif" font-size="9" font-weight="700" fill="#52525b" letter-spacing="2">
        <text x="0" y="42" text-anchor="middle">ESTD. 2025  ·  @DESIGNSFLEEK</text>
      </g>
    </g>

    <!-- 100% ORIGINAL Label Under Shirt -->
    <g transform="translate(0, 240)" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="800" fill="#18181b">
      <text x="0" y="0" font-size="14" letter-spacing="4">100% ORIGINAL</text>
    </g>
  </g>

  <!-- Bottom CTA Pill: DISCOUNT UP TO 50% -->
  <g transform="translate(450, 1510)" filter="url(#pillShadow)">
    <rect x="-220" y="-38" width="440" height="76" rx="38" fill="#09090b" />
    <text
      x="0"
      y="11"
      text-anchor="middle"
      font-family="'Space Grotesk', 'Syne', sans-serif"
      font-weight="700"
      font-size="22"
      letter-spacing="5"
      fill="#ffffff"
    >DISCOUNT UP TO 50%</text>
  </g>
</svg>
