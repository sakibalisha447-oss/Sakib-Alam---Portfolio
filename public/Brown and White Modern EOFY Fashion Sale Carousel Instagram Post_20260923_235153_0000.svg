<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="100%" height="100%">
  <defs>
    <!-- Warm Taupe / Mocha Gradient -->
    <linearGradient id="mochaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#aa8874" />
      <stop offset="100%" stopColor="#9e7c69" />
    </linearGradient>

    <!-- Subtle Vignette / Lighting -->
    <radialGradient id="vignette" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="rgba(255,255,255,0.08)" />
      <stop offset="100%" stopColor="rgba(0,0,0,0.12)" />
    </radialGradient>

    <!-- Model Portrait Clip Paths -->
    <clipPath id="portraitClip1">
      <rect x="70" y="400" width="260" height="520" rx="28" />
    </clipPath>
    <clipPath id="portraitClip2">
      <rect x="370" y="400" width="260" height="520" rx="28" />
    </clipPath>
    <clipPath id="portraitClip3">
      <rect x="670" y="400" width="260" height="520" rx="28" />
    </clipPath>

    <!-- Drop Shadows for Cards -->
    <filter id="frameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#4a362a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Warm Mocha Canvas Background -->
  <rect width="1000" height="1250" fill="url(#mochaBg)" />
  <rect width="1000" height="1250" fill="url(#vignette)" />

  <!-- Top Monumental Editorial Typography: EOFY DEALS -->
  <g
    text-anchor="middle"
    font-family="'Syne', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    letter-spacing="-3"
    fill="#ffffff"
  >
    <text x="500" y="190" font-size="155">EOFY</text>
    <text x="500" y="335" font-size="155">DEALS</text>
  </g>

  <!-- Portrait Frame 1 (Left Model - Crisp White Shirt) -->
  <g filter="url(#frameShadow)">
    <rect x="70" y="400" width="260" height="520" rx="28" fill="#e8dfd8" stroke="#ffffff" stroke-width="4.5" />
    <g clip-path="url(#portraitClip1)">
      <!-- Studio Background Gradient -->
      <rect x="70" y="400" width="260" height="520" fill="#ebe4de" />
      <!-- Soft Sunlight Glow -->
      <circle cx="200" cy="500" r="140" fill="#fff5ec" opacity="0.6" />
      <!-- Model Silhouette: White Button Down Collared Shirt -->
      <g transform="translate(200, 680)">
        <!-- Hair (Auburn / Dark Brunette) -->
        <ellipse cx="0" cy="-140" rx="55" ry="70" fill="#4a2e22" />
        <!-- Face & Neck -->
        <path d="M -22,-140 Q 0,-80 22,-140 Z" fill="#eacbb6" />
        <ellipse cx="0" cy="-115" rx="32" ry="42" fill="#f0d5c3" />
        <!-- Hair Bangs & Waves -->
        <path d="M -35,-145 Q 0,-105 35,-145 Q 45,-90 30,-50 L -30,-50 Q -45,-90 -35,-145 Z" fill="#3d2419" />
        <!-- White Crisp Collared Shirt -->
        <path
          d="M -75, -20
             L -35,-70
             L 35,-70
             L 75,-20
             L 110, 180
             L -110, 180
             Z"
          fill="#ffffff"
        />
        <!-- Collar Points -->
        <polygon points="-35,-70 0,-30 -15,-15" fill="#f4f4f6" />
        <polygon points="35,-70 0,-30 15,-15" fill="#f4f4f6" />
        <!-- Shirt Placket & Creases -->
        <line x1="0" y1="-30" x2="0" y2="180" stroke="#e0e0e6" stroke-width="2" />
      </g>
    </g>
  </g>

  <!-- Portrait Frame 2 (Center Model - Cropped Top, Blue Trousers & Flower) -->
  <g filter="url(#frameShadow)">
    <rect x="370" y="400" width="260" height="520" rx="28" fill="#e8dfd8" stroke="#ffffff" stroke-width="4.5" />
    <g clip-path="url(#portraitClip2)">
      <!-- Studio Light Background -->
      <rect x="370" y="400" width="260" height="520" fill="#eae1da" />
      <!-- Model Figure -->
      <g transform="translate(500, 670)">
        <!-- Short Dark Chic Pixie Hair -->
        <ellipse cx="0" cy="-145" rx="40" ry="48" fill="#1f1815" />
        <!-- Neck & Bare Shoulders (Viewed from Back) -->
        <path d="M -15,-125 L 15,-125 L 20,-85 L -20,-85 Z" fill="#e8c7b0" />
        <!-- White Cropped Tank Top -->
        <path
          d="M -45,-85
             L 45,-85
             L 40,-10
             L -40,-10
             Z"
          fill="#ffffff"
        />
        <!-- Tailored Pale Sky-Blue Trousers -->
        <path
          d="M -46,-10
             L 46,-10
             L 52,190
             L -52,190
             Z"
          fill="#b8d3e2"
        />
        <!-- Seam & Belt Loop Accents -->
        <line x1="0" y1="-10" x2="0" y2="190" stroke="#9bbecf" stroke-width="2" />
        <!-- Orange Daisy / Chrysanthemum Flower Held Behind Back -->
        <g transform="translate(0, 15)">
          <circle cx="0" cy="0" r="14" fill="#ff6f00" />
          <circle cx="0" cy="0" r="6" fill="#ffd54f" />
          <!-- Green Stem -->
          <path d="M 0,14 Q 5,45 -8,80" stroke="#388e3c" stroke-width="3.5" fill="none" />
        </g>
      </g>
    </g>
  </g>

  <!-- Portrait Frame 3 (Right Model - Sage Green Hoodie) -->
  <g filter="url(#frameShadow)">
    <rect x="670" y="400" width="260" height="520" rx="28" fill="#e8dfd8" stroke="#ffffff" stroke-width="4.5" />
    <g clip-path="url(#portraitClip3)">
      <!-- Background Tone -->
      <rect x="670" y="400" width="260" height="520" fill="#e5ddd6" />
      <!-- Model in Relaxed Sage Green Hooded Sweatshirt -->
      <g transform="translate(800, 680)">
        <!-- Sage Green Oversized Hood Structure -->
        <ellipse cx="0" cy="-125" rx="68" ry="78" fill="#7a917b" />
        <!-- Darker Inner Hood Shade -->
        <ellipse cx="0" cy="-125" rx="46" ry="58" fill="#5c735d" />
        <!-- Face inside Hood -->
        <ellipse cx="0" cy="-120" rx="30" ry="40" fill="#ebd2c1" />
        <!-- Eyes & Features Expression -->
        <ellipse cx="-10" cy="-122" rx="3.5" ry="2" fill="#3e2723" />
        <ellipse cx="10" cy="-122" rx="3.5" ry="2" fill="#3e2723" />
        <path d="M -8,-105 Q 0,-98 8,-105" stroke="#a1624b" stroke-width="2.5" fill="none" />
        <!-- Wavy Long Brunette Tresses Flowing Down -->
        <path d="M -38,-95 Q -45,-20 -30,50" stroke="#3e2723" stroke-width="12" fill="none" stroke-linecap="round" />
        <path d="M 38,-95 Q 45,-20 30,50" stroke="#3e2723" stroke-width="12" fill="none" stroke-linecap="round" />
        <!-- Sage Green Hoodie Torso & Shoulders -->
        <path
          d="M -75,-60
             C -40,-45 40,-45 75,-60
             L 105, 180
             L -105, 180
             Z"
          fill="#869e87"
        />
        <!-- Drawstrings -->
        <path d="M -15,-45 L -18,20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
        <path d="M 15,-45 L 18,20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- Bottom Crisp White Solid Banner Box -->
  <g transform="translate(0, 990)">
    <rect x="0" y="0" width="1000" height="260" fill="#ffffff" />
    <g text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif">
      <text
        x="500"
        y="80"
        font-size="21"
        font-weight="700"
        letter-spacing="0.5"
        fill="#1c1917"
      >Exclusive savings across selected products, available for a limited time</text>
      <text
        x="500"
        y="115"
        font-size="21"
        font-weight="700"
        letter-spacing="0.5"
        fill="#1c1917"
      >only during our EOFY sale event.</text>
      
      <!-- Subtle Brand Signoff -->
      <text
        x="500"
        y="175"
        font-size="14"
        font-weight="600"
        letter-spacing="6"
        fill="#78716c"
      >@DESIGNSFLEEK  ·  CURATED EDITORIAL CAMPAIGN</text>
    </g>
  </g>
</svg>
